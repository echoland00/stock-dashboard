<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股板塊 Interactive Chart</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f23; color: #eee; padding: 16px; }
        .header { text-align: center; padding: 12px 0 8px; }
        .header h1 { font-size: 20px; color: #fff; margin-bottom: 2px; }
        .header .date { color: #777; font-size: 12px; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 8px 0 12px; }
        .period-btn { padding: 4px 14px; border-radius: 14px; border: 1px solid #444; background: #1a1a3e; color: #aaa; font-size: 12px; cursor: pointer; }
        .period-btn.active { background: #6c5ce7; color: #fff; border-color: #6c5ce7; }
        select { background: #1a1a3e; color: #ddd; border: 1px solid #444; padding: 4px 10px; border-radius: 6px; font-size: 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; padding: 0 4px; }
        .plot-card { background: #151530; border-radius: 10px; border: 1px solid #2a2a4e; overflow: hidden; }
        .plot-card .title { padding: 8px 12px 2px; font-size: 13px; font-weight: 600; color: #fff; display: flex; justify-content: space-between; }
        .plot-card .title .range { font-weight: 400; font-size: 11px; color: #777; }
        .plot-card .color-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 2px 12px 6px; font-size: 10px; color: #aaa; }
        .color-legend .item { display: flex; align-items: center; gap: 4px; }
        .color-legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .plot-card .plot { width: 100%; height: 260px; }
        .summary { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
        .summary-item { background: #1a1a3e; border-radius: 8px; padding: 8px 14px; border: 1px solid #2a2a4e; text-align: center; min-width: 120px; }
        .summary-item .label { font-size: 10px; color: #888; }
        .summary-item .val { font-size: 15px; font-weight: 700; margin-top: 2px; }
        .up { color: #00d4aa; }
        .down { color: #ff6b6b; }
        .section { margin: 20px 0; background: #151530; border-radius: 10px; border: 1px solid #2a2a4e; padding: 16px; }
        .section-label { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 12px; }
        .group-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .group-table th { background: #1a1a3e; color: #888; padding: 8px 10px; text-align: left; border-bottom: 1px solid #333; font-weight: 600; position: sticky; top: 0; }
        .group-table td { padding: 6px 10px; border-bottom: 1px solid #2a2a3e; color: #ccc; }
        .group-table tr:hover td { background: #1a1a3e; }
        .group-table .tickers { color: #00d4aa; font-family: monospace; font-size: 11px; }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .plot-card .plot { height: 200px; }
            .header h1 { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📊 美股板塊 Trend</h1>
    <div class="date" id="updateDate"></div>
</div>

<div class="controls">
    <button class="period-btn active" data-days="60">3M</button>
    <button class="period-btn" data-days="125">6M</button>
    <button class="period-btn" data-days="250">1Y</button>
    <select id="viewMode">
        <option value="cumulative">Cumulative (Base 100)</option>
        <option value="daily">Daily Return %</option>
    </select>
</div>

<div class="summary" id="summaryContainer"></div>

<div class="grid" id="chartGrid"></div>

<div class="section" id="stockSection">
    <div class="section-label">📋 Stock Composition by Industrial Group</div>
    <div style="overflow-x:auto;">
        <table class="group-table">
            <thead><tr><th>Industrial Group</th><th>Cluster (Sector)</th><th>Tickers</th></tr></thead>
            <tbody id="stockTableBody"></tbody>
        </table>
    </div>
</div>

<script>
const COLORS = ['#00FF88','#FFD700','#FF6B9D','#00D4FF','#FF9500','#FF3333','#33FF57','#FF33F1','#3399FF','#FF6600','#CC33FF','#FFDD00','#00FFCC','#FF4466'];
const SECTOR_ORDER = ['Information Technology','Communication Services','Consumer Discretionary','Consumer Staples','Health Care','Financials','Energy','Industrials','Materials','Utilities','Real Estate'];

let allData = null;
let currentDays = 60;
let currentView = 'cumulative';

async function loadData() {
    try {
        const r = await fetch('data.json');
        return await r.json();
    } catch(e) { return null; }
}

function groupDailyReturns(dates, groupRets, days, view) {
    const sliced = {};
    const d = dates.slice(-days);
    for (const [name, rets] of Object.entries(groupRets)) {
        const vals = rets.slice(-days);
        if (view === 'cumulative') {
            let cum = 100;
            sliced[name] = vals.map(r => { cum *= (1 + r/100); return Math.round(cum*100)/100; });
        } else {
            sliced[name] = vals.map(r => Math.round(r*100)/100);
        }
    }
    return { dates: d, groups: sliced };
}

function getLastVal(groups, name) {
    const v = groups[name];
    return v ? v[v.length-1] : null;
}

function renderStockTable(data) {
    const tb = document.getElementById('stockTableBody');
    tb.innerHTML = '';
    const groups = Object.keys(data.stocks || {}).sort();
    for (const grp of groups) {
        const sec = data.sectors[grp] || '';
        const tix = (data.stocks[grp] || []).join(', ');
        const row = document.createElement('tr');
        row.innerHTML = `<td>${grp}</td><td>${sec}</td><td class="tickers">${tix}</td>`;
        tb.appendChild(row);
    }
}

function render() {
    if (!allData) return;
    const { dates, groups: grpRets } = allData;
    const { dates: slicedDates, groups: slicedGroups } = groupDailyReturns(dates, grpRets, currentDays, currentView);
    const sectors = allData.sectors || {};
    
    // Summary
    let best = { n: '', v: -Infinity }, worst = { n: '', v: Infinity };
    for (const [n, v] of Object.entries(slicedGroups)) {
        const last = v[v.length-1];
        if (last > best.v) best = { n, v: last };
        if (last < worst.v) worst = { n, v: last };
    }
    const allVals = Object.values(slicedGroups).map(v => v[v.length-1]);
    const avg = allVals.reduce((a,b)=>a+b,0) / allVals.length;
    document.getElementById('summaryContainer').innerHTML = `
        <div class="summary-item"><div class="label">🏆 Best</div><div class="val up">${best.n}</div><div class="label">${currentView === 'cumulative' ? best.v.toFixed(1) : '+' + best.v.toFixed(2) + '%'}</div></div>
        <div class="summary-item"><div class="label">📉 Worst</div><div class="val down">${worst.n}</div><div class="label">${currentView === 'cumulative' ? worst.v.toFixed(1) : worst.v.toFixed(2) + '%'}</div></div>
        <div class="summary-item"><div class="label">📊 Avg Group</div><div class="val" style="color:#fff">${avg.toFixed(1)}</div><div class="label">${Object.keys(slicedGroups).length} groups</div></div>
    `;
    document.getElementById('updateDate').textContent = `Updated: ${slicedDates[slicedDates.length-1]} | ${slicedDates.length} trading days`;
    
    // Stock table
    renderStockTable(allData);
    
    // Subplots by sector
    const grid = document.getElementById('chartGrid');
    grid.innerHTML = '';
    
    for (const sector of SECTOR_ORDER) {
        const groupsInSector = Object.entries(sectors).filter(([,s]) => s === sector).map(([g]) => g);
        const validGroups = groupsInSector.filter(g => slicedGroups[g]);
        if (!validGroups.length) continue;
        
        const card = document.createElement('div');
        card.className = 'plot-card';
        const titleDiv = document.createElement('div');
        titleDiv.className = 'title';
        const lastVals = validGroups.map(g => `${g} ${getLastVal(slicedGroups, g).toFixed(1)}`).join(' | ');
        titleDiv.innerHTML = `<span>${sector}</span><span class="range">${lastVals}</span>`;
        card.appendChild(titleDiv);
        
        // Color legend strip
        const legendDiv = document.createElement('div');
        legendDiv.className = 'color-legend';
        validGroups.forEach((g, i) => {
            const item = document.createElement('span');
            item.className = 'item';
            item.innerHTML = '<span class="dot" style="background:' + COLORS[i % COLORS.length] + '"></span>' + g;
            legendDiv.appendChild(item);
        });
        card.appendChild(legendDiv);
        
        const plotDiv = document.createElement('div');
        plotDiv.className = 'plot';
        plotDiv.id = `p-${sector.replace(/[^a-z]/gi,'')}`;
        card.appendChild(plotDiv);
        grid.appendChild(card);
        
        const traces = validGroups.map((g, i) => ({
            x: slicedDates, y: slicedGroups[g], type: 'scatter', mode: 'lines', name: g,
            line: { color: COLORS[i % COLORS.length], width: 2.5 },
            hovertemplate: `<b>${g}</b><br>%{x|%m/%d}<br>${currentView==='cumulative'?'%{y:.1f}':'%{y:.2f}%'}<extra></extra>`
        }));
        const layout = {
            paper_bgcolor: '#151530', plot_bgcolor: '#151530',
            margin: { l: 30, r: 8, t: 4, b: 24 }, showlegend: false,
            xaxis: { gridcolor: '#2a2a3e', tickfont: {color:'#666',size:8}, zeroline: false },
            yaxis: { gridcolor: '#2a2a3e', tickfont: {color:'#666',size:8}, zeroline: currentView==='daily', zerolinecolor: '#444' },
            hovermode: 'closest', dragmode: false,
            hoverlabel: { bgcolor: '#1a1a3e', font: {color: '#fff', size: 11}, bordercolor: '#2a2a4e' },
        };
        Plotly.newPlot(plotDiv.id, traces, layout, { responsive: true, displayModeBar: false });
    }
}

loadData().then(data => {
    if (data) { allData = data; render(); }
    else document.getElementById('chartGrid').innerHTML = '<div style="text-align:center;padding:40px;color:#888;">⚠️ Failed to load data</div>';
});

document.querySelectorAll('.period-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDays = parseInt(btn.dataset.days);
        render();
    };
});
document.getElementById('viewMode').onchange = e => { currentView = e.target.value; render(); };
</script>
</body>
</html>
